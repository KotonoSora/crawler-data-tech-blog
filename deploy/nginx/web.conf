# MFE edge: serves the shell build at /, the remote bundles under /mfe/<app>/, and
# proxies /api to api-service (spec 07 file 01/05, baseline 04 §4).
server {
    # The runtime image runs as the unprivileged `nginx` user; compose lowers the
    # unprivileged port floor so port 80 remains the edge contract (NFR-20).
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api-service:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Remote MFE bundles keep fixed filenames (tb-<app>.js) — revalidate on each
    # load, never mark them immutable. `expires` is used instead of `add_header`
    # here: a location-level add_header would cancel the server-level security
    # headers above (nginx does not inherit them once a location adds its own).
    location /mfe/ {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }
}
