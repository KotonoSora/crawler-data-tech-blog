# Optional archive static serving (compose profile "serving").
# Read-only mount of data/uploads; directory listing is OFF (hard requirement).
server {
    listen 80;
    server_name _;

    autoindex off;
    root /srv;

    location /archive/ {
        alias /srv/archive/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-store" always;
    }
}
