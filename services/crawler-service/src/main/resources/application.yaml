spring:
  application:
    name: crawler-service
  datasource:
    url: ${CRAWLER_DB_URL:jdbc:postgresql://localhost:5432/crawler_db}
    username: ${CRAWLER_DB_USER:techblog_crawler_app}
    password: ${CRAWLER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      connection-init-sql: "SET statement_timeout = 30000; SET lock_timeout = 5000; SET idle_in_transaction_session_timeout = 60000"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    user: ${FLYWAY_USER:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

crawler:
  role: ${CRAWLER_ROLE:all}
  global-hosts: ${CRAWLER_GLOBAL_HOSTS:4}
  contact: ${CRAWLER_CONTACT:}
  archive-root: ${CRAWLER_ARCHIVE_ROOT:/app/data/uploads/crawl}
  default-delay-ms: ${CRAWLER_DEFAULT_DELAY_MS:2000}
  medium-delay-ms: ${CRAWLER_MEDIUM_DELAY_MS:3000}
  connect-timeout-ms: 10000
  read-timeout-ms: 30000
  max-html-bytes: 10485760
  min-content-chars: 200
  max-assets: 100
  max-asset-bytes: 52428800
  max-links-backfill: 500
  max-links-incremental: 50
  retry-backoff-seconds: 30,120,600,3600,21600
  robots-ttl-seconds: 3600
  job-lease-seconds: 300
  min-free-bytes: 5368709120
